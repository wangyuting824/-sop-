name: Offline calibration checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ".[vision,fit]"
      - run: python -m unittest discover -s tests -v
      - run: robotcal collect --config configs/xuchuang/arms.yaml --session artifacts/ci --replay tests/samples/arms.jsonl
